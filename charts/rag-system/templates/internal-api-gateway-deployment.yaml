{{- if .Values.internalApiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-system.componentFullname" (dict "component" .Values.internalApiGateway "context" .) }}
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.internalApiGateway.name }}
spec:
  replicas: {{ .Values.replicaCount }} # Global replicaCount, or specific .Values.internalApiGateway.replicaCount
  selector:
    matchLabels:
      {{- include "rag-system.selectorLabelsComponent" (dict "componentName" .Values.internalApiGateway.name "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-system.selectorLabelsComponent" (dict "componentName" .Values.internalApiGateway.name "context" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-system.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.internalApiGateway.name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/entrypoint.sh"]
          args: ["internal_api_gateway"] # Specific argument for this service
          ports:
            - name: http
              containerPort: {{ .Values.internalApiGateway.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rag-system.componentFullname" (dict "component" .Values.internalApiGateway "context" .) }}-config
          livenessProbe:
            httpGet:
              path: /gateway_health # Ensure this path exists in your gateway app
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /gateway_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.internalApiGateway.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
