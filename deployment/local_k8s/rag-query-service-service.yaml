apiVersion: v1
kind: Service
metadata:
  name: rag-query-service
  namespace: default # Or your target namespace
  labels:
    app: rag-query-service
spec:
  type: ClusterIP # Only needs to be accessible within the cluster by the API Gateway
  selector:
    app: rag-query-service # Matches the labels of the Pods in the Deployment
  ports:
  - name: http
    port: 8001 # Port the Service listens on (this is what API Gateway's RAG_QUERY_SERVICE_URL will use)
    targetPort: 8001 # Port the container (RAG service app) listens on (must match containerPort and RAG_SERVICE_PORT)
    protocol: TCP
