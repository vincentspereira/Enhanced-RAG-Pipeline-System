# Default values for rag-system chart.
replicaCount: 1

image:
  repository: your-dockerhub-username/rag-system # TODO: Update with your image repository
  pullPolicy: IfNotPresent
  tag: "iter14-local" # Updated for iteration

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Service configurations for each microservice --
internalApiGateway:
  enabled: true
  name: internal-api-gateway
  containerPort: 8000
  service:
    type: NodePort
    port: 80
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  config:
    RAG_QUERY_SERVICE_URL: "http://{{ include \"rag-system.componentFullname\" (dict \"component\" .Values.ragQueryService \"context\" .) }}:{{ .Values.ragQueryService.service.port }}"
    DOC_PROCESSING_SERVICE_URL: "http://{{ include \"rag-system.componentFullname\" (dict \"component\" .Values.docProcessingService \"context\" .) }}:{{ .Values.docProcessingService.service.port }}"
    API_GATEWAY_PORT: {{ .Values.internalApiGateway.containerPort | quote }}
    LOGGING_LEVEL: "INFO"
  apiKeys:
    existingSecret:
      name: "rag-gateway-apikeys-secret"
      keyName: "api-keys-csv"
    createSecret: false

ragQueryService:
  enabled: true
  name: rag-query-service
  containerPort: 8001
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "6Gi"
  config:
    RAG_SERVICE_PORT: "8001"
    QDRANT_HOST: {{ .Values.qdrant.enabled | ternary (printf "%s-qdrant" .Release.Name) "qdrant-service" }}
    QDRANT_PORT: "6333"
    QDRANT_COLLECTION_NAME: "documents"
    EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
    MODEL_DEVICE: "cpu"
    OLLAMA_API_URL: "http://{{ .Values.ollama.enabled | ternary (printf "%s-ollama" .Release.Name) .Values.ollama.externalConfig.service.name }}:{{ .Values.ollama.externalConfig.service.port }}"
    LLM_MODEL_NAME: "llama2"
    LOGGING_LEVEL: "INFO"
    REDIS_HOST: {{ .Values.redis.enabled | ternary (printf "%s-redis-master" .Release.Name) "redis-service" }}
    REDIS_PORT: "6379"
    # REDIS_PASSWORD: "" # Sourced from secret if redis.auth.existingSecret is set
    REDIS_DB_RAG_CACHE: "1"
    SEARCH_RESULTS_CACHE_TTL_SECONDS: "3600"
    LLM_ANSWER_CACHE_TTL_SECONDS: "86400"
    SEMANTIC_SEARCH_TOP_K_CANDIDATES: "50"
    RRF_K_CONSTANT: "60"

docProcessingService:
  enabled: true
  name: doc-processing-service
  containerPort: 8002
  service:
    type: ClusterIP
    port: 8002
  resources:
    requests:
      cpu: "300m"
      memory: "1Gi"
    limits:
      cpu: "1500m"
      memory: "3Gi"
  config:
    DOC_PROCESSING_SERVICE_PORT: "8002"
    QDRANT_HOST: {{ .Values.qdrant.enabled | ternary (printf "%s-qdrant" .Release.Name) "qdrant-service" }}
    QDRANT_PORT: "6333"
    QDRANT_COLLECTION_NAME: "documents"
    EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
    MODEL_DEVICE: "cpu"
    LOGGING_LEVEL: "INFO"
    CHUNK_SIZE: "1000"
    CHUNK_OVERLAP: "200"

# --- Subchart configurations for Dependencies ---
qdrant:
  enabled: false
  # fullnameOverride: {{ printf "%s-qdrant" .Release.Name }}
  # persistence:
  #   size: 10Gi

redis:
  enabled: false
  # fullnameOverride: {{ printf "%s-redis" .Release.Name }} # Bitnami chart uses -master suffix
  auth:
    enabled: false # Set to true to enable password auth for Redis
    # existingSecret: "" # Name of K8s Secret holding the Redis password, e.g., "my-redis-secret"
    # existingSecretPasswordKey: "redis-password" # Key in the secret for the password
    # password: "your-strong-password" # If not using existingSecret, Bitnami chart creates a secret with this. NOT RECOMMENDED for direct values.
  master:
    persistence:
      enabled: false # Typically false for cache

ollama:
  enabled: false
  # If enabled, local subchart from ./charts/ollama is deployed.
  # Service name will be {{ .Release.Name }}-ollama.
  # Configure subchart values directly under 'ollama:' key, e.g.:
  # image:
  #   tag: "0.1.29"
  # persistence:
  #   size: "50Gi"
  externalConfig: # Used if ollama.enabled is false
    service:
      name: "ollama-service"
      port: 11434

rabbitmq:
  enabled: false
  # fullnameOverride: {{ printf "%s-rabbitmq" .Release.Name }}
  auth:
    username: "user"
    # To use an existing secret for the password:
    # existingPasswordSecret: "my-rabbitmq-password-secret" # Name of your K8s Secret
    # existingPasswordSecretKey: "rabbitmq-password"       # Key in the Secret that holds the password
    # If existingPasswordSecret is not set, the password below will be used.
    # The Bitnami chart will typically create its own secret if password is provided directly.
    password: "password" # Default for local dev if not using existingSecret. CHANGE FOR PRODUCTION.
  persistence:
    enabled: false

# --- Common Application Settings ---
commonConfig:
  ENVIRONMENT_NAME: "development"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext: {}
securityContext: {}
