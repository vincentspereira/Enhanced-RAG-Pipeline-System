apiVersion: v1
kind: Service
metadata:
  name: doc-processing-service
  namespace: default # Or your target namespace
  labels:
    app: doc-processing-service
spec:
  type: ClusterIP # Only needs to be accessible within the cluster by the API Gateway
  selector:
    app: doc-processing-service # Matches the labels of the Pods in the Deployment
  ports:
  - name: http
    port: 8002 # Port the Service listens on (this is what API Gateway's DOC_PROCESSING_SERVICE_URL will use)
    targetPort: 8002 # Port the container (doc processing app) listens on
    protocol: TCP
