apiVersion: v1
kind: Namespace
metadata:
  name: rag-pipeline

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-pipeline-config
  namespace: rag-pipeline
data:
  config.yaml: |
    model:
      embedding_model: "Snowflake-Labs/arctic-embed2"
      llm_model: "meta-llama/Llama-2-7b-hf"
      device: "cuda"
    vector_store:
      store_type: "qdrant"
      host: "qdrant-service"
      port: 6333

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pipeline-api
  namespace: rag-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-pipeline-api
  template:
    metadata:
      labels:
        app: rag-pipeline-api
    spec:
      containers:
      - name: rag-pipeline-api
        image: rag-pipeline:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: 1
          requests:
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: cache-volume
          mountPath: /app/cache
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: config-volume
        configMap:
          name: rag-pipeline-config
      - name: cache-volume
        emptyDir: {}
      - name: logs-volume
        persistentVolumeClaim:
          claimName: rag-pipeline-logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: rag-pipeline-api
  namespace: rag-pipeline
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: rag-pipeline-api

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: rag-pipeline
spec:
  serviceName: qdrant-service
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
  volumeClaimTemplates:
  - metadata:
      name: qdrant-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: rag-pipeline
spec:
  ports:
  - port: 6333
    targetPort: 6333
  selector:
    app: qdrant

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-pipeline-monitor
  namespace: rag-pipeline
spec:
  selector:
    matchLabels:
      app: rag-pipeline-api
  endpoints:
  - port: http
    path: /metrics

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-pipeline-hpa
  namespace: rag-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-pipeline-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
