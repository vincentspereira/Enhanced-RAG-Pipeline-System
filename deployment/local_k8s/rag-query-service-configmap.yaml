apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-query-service-config
  namespace: default # Or your target namespace
data:
  RAG_SERVICE_PORT: "8001" # Port the RAG service itself will listen on
  RAG_SERVICE_HOST: "0.0.0.0"

  # Qdrant Configuration
  QDRANT_HOST: "qdrant-service" # K8s service name for Qdrant
  QDRANT_PORT: "6333" # Qdrant HTTP port
  # QDRANT_GRPC_PORT: "6334" # Qdrant gRPC port, if used by client
  QDRANT_COLLECTION_NAME: "documents" # Default collection, can be overridden
  # QDRANT_API_KEY: "" # Set if your Qdrant instance requires an API key (use Secrets for actual keys)

  # Embedding Model Configuration
  EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2" # Default model
  MODEL_DEVICE: "cpu" # "cpu" or "cuda". Ensure Docker image and K8s node support CUDA if "cuda".

  # Ollama and LLM Configuration
  OLLAMA_API_URL: "http://ollama-service:11434" # K8s service name for Ollama
  LLM_MODEL_NAME: "llama2" # Default LLM model to use with Ollama (e.g., llama2, mistral)

  LOGGING_LEVEL: "INFO"
  # Add other necessary configurations for the RAG Query Service here
  # For example, if it needed to connect to PostgreSQL for metadata:
  # POSTGRES_HOST: "postgres-service"
  # POSTGRES_PORT: "5432"
  # POSTGRES_USER: "rag_user"
  # POSTGRES_DB: "rag_metadata_db"
  # POSTGRES_PASSWORD: "" # This should come from a Secret, not ConfigMap
