name: RAG Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6334:6333

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-timeout

    - name: Run tests
      run: |
        pytest tests/ --cov=Scripts --cov-report=xml -v    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  integration_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        QDRANT_URL: http://localhost:6333
      run: |
        pytest --cov=. --cov-report=xml
        
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install linting dependencies
      run: |
        pip install flake8 black isort mypy
        
    - name: Run linters
      run: |
        flake8 .
        black . --check
        isort . --check
        mypy .

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  build-and-push:
    needs: [test, lint, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build Docker image (no push yet)
      id: build_image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false # Build locally first, don't push yet
        load: true # Load the image into the local Docker daemon for scanning
        tags: user/rag-pipeline:${{ github.sha }} # Tag with SHA for scanning
        cache-from: type=registry,ref=user/rag-pipeline:buildcache
        cache-to: type=registry,ref=user/rag-pipeline:buildcache,mode=max

    - name: Install Trivy
      run: |
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Scan Docker image with Trivy
      run: |
        trivy image --exit-code 0 --severity HIGH,CRITICAL user/rag-pipeline:${{ github.sha }}
        # Use --exit-code 1 to fail CI on critical/high vulnerabilities, e.g.:
        # trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed user/rag-pipeline:${{ github.sha }}

    - name: Push Docker image (if scan passes or is informational)
      # This step assumes the previous trivy scan either passed (exit-code 0)
      # or its failure is handled (e.g. by not using --exit-code 1, or by a conditional if)
      # For a stricter pipeline, you might only run this if trivy exits 0.
      # For now, this will run regardless of trivy's exit code unless trivy itself fails the job.
      # To make it conditional, you'd need to manage the output/status of the trivy step.
      # A simpler approach for now is to let Trivy fail the job if --exit-code 1 is used and issues are found.
      # If Trivy found issues and exited with 1, this push step won't run.
      uses: docker/build-push-action@v4
      with:
        context: . # Re-specify context, though image is already built
        push: true
        tags: |
          user/rag-pipeline:latest
          user/rag-pipeline:${{ github.sha }}
        # No need to specify cache here again if relying on the loaded image from previous step
        # However, this action might rebuild if it doesn't find the exact image via its own mechanisms.
        # To ensure it pushes the already built and loaded image:
        # This action pushes the tags specified. If the image `user/rag-pipeline:${{ github.sha }}`
        # is loaded into Docker from the previous 'build_image' step, this should pick it up.

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, integration_test, api_hub_test, vector_search_test, performance_test]
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        bash deployment/deploy.sh

  api_hub_test:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-mock httpx requests PyJWT pyyaml slowapi
        
    - name: Run API Hub tests
      run: |
        pytest tests/simplified_api_hub_test.py tests/integration_api_hub_test.py tests/e2e_api_hub_test.py -v --cov=Scripts.api_v1 --cov-report=xml
        
    - name: Upload API Hub coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  vector_search_test:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-mock
        
    - name: Run Vector Search tests
      run: |
        pytest tests/test_vector_search.py -v --cov=Scripts.vector_search --cov-report=xml
        
    - name: Upload Vector Search coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  performance_test:
    runs-on: ubuntu-latest
    needs: [api_hub_test, vector_search_test]
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-benchmark
        
    - name: Run Performance tests
      run: |
        pytest tests/test_performance.py -v
