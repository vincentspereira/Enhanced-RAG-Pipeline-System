# Default values for rag-system chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: your-dockerhub-username/rag-system # TODO: Update with your image repository
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest" # Or specific version like "iter9"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Service configurations for each microservice --

internalApiGateway:
  enabled: true
  name: internal-api-gateway # Used for component naming
  containerPort: 8000
  service:
    type: NodePort
    port: 80
    # nodePort: 30080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  config:
    # Note: The context for include is '.', so .Release.Name works.
    # For component names, we pass the specific component's values to the helper.
    RAG_QUERY_SERVICE_URL: "http://{{ include \"rag-system.componentFullname\" (dict \"component\" .Values.ragQueryService \"context\" .) }}:{{ .Values.ragQueryService.service.port }}"
    DOC_PROCESSING_SERVICE_URL: "http://{{ include \"rag-system.componentFullname\" (dict \"component\" .Values.docProcessingService \"context\" .) }}:{{ .Values.docProcessingService.service.port }}"
    API_GATEWAY_PORT: {{ .Values.internalApiGateway.containerPort | quote }}
    LOGGING_LEVEL: "INFO"
    VALID_API_KEYS_CSV: "changeme-local-key1,changeme-local-key2" # TODO: Change for actual deployments.

ragQueryService:
  enabled: true
  name: rag-query-service
  containerPort: 8001
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  config:
    RAG_SERVICE_PORT: "8001"
    # Conditional QDRANT_HOST and REDIS_HOST based on whether subcharts are enabled
    QDRANT_HOST: {{ .Values.qdrant.enabled | ternary (printf "%s-qdrant" .Release.Name) "qdrant-service" }}
    QDRANT_PORT: "6333" # Usually fixed by Qdrant chart or manual service
    QDRANT_COLLECTION_NAME: "documents"
    EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
    MODEL_DEVICE: "cpu"
    OLLAMA_API_URL: "http://ollama-service:11434" # Assuming ollama-service is deployed manually or by another chart
    LLM_MODEL_NAME: "llama2"
    LOGGING_LEVEL: "INFO"
    REDIS_HOST: {{ .Values.redis.enabled | ternary (printf "%s-redis-master" .Release.Name) "redis-service" }} # Bitnami Redis chart often names master service like this
    REDIS_PORT: "6379" # Usually fixed by Redis chart or manual service
    REDIS_DB_RAG_CACHE: "1"
    SEARCH_RESULTS_CACHE_TTL_SECONDS: "3600"
    LLM_ANSWER_CACHE_TTL_SECONDS: "86400"

docProcessingService:
  enabled: true
  name: doc-processing-service
  containerPort: 8002
  service:
    type: ClusterIP
    port: 8002
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  config:
    DOC_PROCESSING_SERVICE_PORT: "8002"
    QDRANT_HOST: {{ .Values.qdrant.enabled | ternary (printf "%s-qdrant" .Release.Name) "qdrant-service" }}
    QDRANT_PORT: "6333"
    QDRANT_COLLECTION_NAME: "documents"
    EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
    MODEL_DEVICE: "cpu"
    LOGGING_LEVEL: "INFO"

# --- Subchart configurations for Dependencies ---

# Qdrant subchart values (from https://github.com/qdrant/qdrant-helm)
# Users can override these by passing their own values file or using --set qdrant.xxx
qdrant:
  enabled: false # Set to true to deploy Qdrant as a subchart
  # Example overrides for the Qdrant subchart:
  # replicaCount: 1
  # persistence:
  #   enabled: false # For local dev, true for production
  #   size: 5Gi
  # service:
  #   type: ClusterIP
  #   httpPort: 6333
  #   grpcPort: 6334
  #   name: qdrant # This name might be overridden by Helm's fullname templating for subcharts
                 # The QDRANT_HOST above uses {{ .Release.Name }}-qdrant for predictability.

# Redis subchart values (from Bitnami Redis chart: https://github.com/bitnami/charts/tree/main/bitnami/redis)
# Users can override these.
redis:
  enabled: false # Set to true to deploy Redis as a subchart
  # Example overrides for the Bitnami Redis subchart:
  # architecture: standalone # or "replication" or "cluster"
  # auth:
  #   enabled: false # Set to true and provide a password for production
  #   # password: "yourredispassword"
  # master:
  #   persistence:
  #     enabled: false # For local dev cache, true if persistence needed
  #     size: 2Gi
  # replica:
  #   replicaCount: 0 # For standalone

# --- Common Application Settings (can be expanded) ---
commonConfig:
  ENVIRONMENT_NAME: "development"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext: {}
securityContext: {}
