apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-api-gateway-config
  namespace: default # Or your target namespace
data:
  # These URLs should point to the Kubernetes service names and ports of the backend services
  # Example: http://<service-name>.<namespace>.svc.cluster.local:<port>
  # For default namespace and standard service exposure: http://<service-name>:<port>
  RAG_QUERY_SERVICE_URL: "http://rag-query-service:8001" # Service name 'rag-query-service', port 8001
  DOC_PROCESSING_SERVICE_URL: "http://doc-processing-service:8002" # Service name 'doc-processing-service', port 8002
  API_GATEWAY_PORT: "8000" # Port the gateway itself will listen on
  API_GATEWAY_HOST: "0.0.0.0"
  # Add other general configurations if needed by the gateway itself
  LOGGING_LEVEL: "INFO"
