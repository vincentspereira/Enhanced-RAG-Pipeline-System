apiVersion: v1
kind: Service
metadata:
  name: redis-service # This name will be used by other services (e.g., RAG Query Service)
  namespace: default # Or your target namespace
  labels:
    app: redis
spec:
  type: ClusterIP # Only needs to be accessible within the cluster
  ports:
  - name: redis-port
    port: 6379       # Port the Service listens on
    targetPort: 6379 # Port on the Redis container
    protocol: TCP
  selector:
    app: redis # Matches labels of the Redis pods from the Deployment
