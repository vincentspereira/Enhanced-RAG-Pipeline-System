apiVersion: v1
kind: Namespace
metadata:
  name: rag-pipeline

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-pipeline-config
  namespace: rag-pipeline
data:
  config.yaml: |
    model:
      embedding_model: "Snowflake-Labs/arctic-embed2"
      llm_model: "meta-llama/Llama-2-7b-hf"
      device: "cuda"
    vector_store:
      store_type: "qdrant"
      host: "qdrant-service"
      port: 6333

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pipeline-api
  namespace: rag-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-pipeline-api
  template:
    metadata:
      labels:
        app: rag-pipeline-api
    spec:
      securityContext: # Pod-level security context
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      containers:
      - name: rag-pipeline-api
        # IMPORTANT: Replace with your actual image registry and version/tag for production
        image: your-registry/rag-pipeline:<VERSION>
        securityContext: # Container-level security context
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          # Note: For GPU access with nvidia.com/gpu, specific capabilities might be needed if dropping ALL.
          # However, the NVIDIA device plugin usually handles this. If issues arise, review required capabilities.
          # For example, some setups might require adding back 'SYS_ADMIN' or specific driver-related caps,
          # but this is less common with modern device plugins. Start with dropping ALL.
          readOnlyRootFilesystem: false # Set to true if possible, but app needs to write to /app/cache, /app/logs if not on PVs
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health # Assuming a /health endpoint exists in your API
            port: 8000
          initialDelaySeconds: 60 # Time to wait before first probe (e.g., for model loading)
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health # Assuming a /health endpoint exists in your API
            port: 8000
          initialDelaySeconds: 120 # Longer delay for liveness, after app should be fully up
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: 1
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: 1 # Also request GPU to ensure scheduling on GPU node
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: cache-volume
          mountPath: /app/cache
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: config-volume
        configMap:
          name: rag-pipeline-config
      - name: cache-volume
        # For persistent cache across pod restarts, define and use a PersistentVolumeClaim.
        # Example:
        persistentVolumeClaim:
          claimName: rag-pipeline-cache-pvc # This PVC needs to be created separately or dynamically provisioned.
        # If ephemeral cache is acceptable (lost on pod restart), use emptyDir:
        # emptyDir: {}
      - name: logs-volume
        # This PersistentVolumeClaim needs to be created separately
        # or dynamically provisioned by a StorageClass in your cluster.
        persistentVolumeClaim:
          claimName: rag-pipeline-logs-pvc

---
# Example PVC definition for logs (if not dynamically provisioned) - place in its own YAML or apply separately
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: rag-pipeline-logs-pvc
#   namespace: rag-pipeline
# spec:
#   accessModes:
#     - ReadWriteOnce # Or ReadWriteMany if supported by your storage and multiple pods need to write
#   resources:
#     requests:
#       storage: 10Gi # Adjust size as needed
# ---
# Example PVC definition for cache (if not dynamically provisioned) - place in its own YAML or apply separately
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: rag-pipeline-cache-pvc
#   namespace: rag-pipeline
# spec:
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 5Gi # Adjust size as needed

---
apiVersion: v1
kind: Service
metadata:
  name: rag-pipeline-api
  namespace: rag-pipeline
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: rag-pipeline-api

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: rag-pipeline
spec:
  serviceName: qdrant-service
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      securityContext: # Pod-level security context for Qdrant
        runAsUser: 1002 # Different UID for Qdrant, or use Qdrant's default if known
        runAsGroup: 1002
        fsGroup: 1002 # Ensures the process can write to the volume
        runAsNonRoot: true
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        securityContext: # Container-level security context for Qdrant
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          # Qdrant official image runs as non-root. If specific capabilities were needed, they'd be added here.
          readOnlyRootFilesystem: true # Qdrant should only need to write to its data volume
        ports:
        - containerPort: 6333
        # Add liveness/readiness probes for Qdrant
        readinessProbe:
          httpGet:
            path: /health # Qdrant's health endpoint
            port: 6333 # Or 6334 if REST port is preferred for health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 6333
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage # Qdrant writes data here
  volumeClaimTemplates:
  - metadata:
      name: qdrant-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: rag-pipeline
spec:
  ports:
  - port: 6333
    targetPort: 6333
  selector:
    app: qdrant

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-pipeline-monitor
  namespace: rag-pipeline
spec:
  selector:
    matchLabels:
      app: rag-pipeline-api
  endpoints:
  - port: http
    path: /metrics

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-pipeline-hpa
  namespace: rag-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-pipeline-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
