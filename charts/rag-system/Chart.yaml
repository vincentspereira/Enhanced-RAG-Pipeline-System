apiVersion: v2
name: rag-system
description: A Helm chart for deploying the RAG System core services

# A chart can be either an 'application' or a 'library' chart.
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the appVersion.
version: 0.1.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application.
appVersion: "1.0.0" # Corresponds to the version of the app itself

dependencies:
  - name: qdrant
    version: "0.7.3" # Check for latest stable/compatible version from Qdrant's Helm repo
    repository: "https://qdrant.github.io/qdrant-helm"
    condition: qdrant.enabled # Only install if qdrant.enabled is true in values.yaml
    # alias: qdrant-dependency # Optional alias if needed

  - name: redis
    version: "18.14.0" # Check for latest stable/compatible version from Bitnami's Helm repo
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled # Only install if redis.enabled is true in values.yaml
    # alias: redis-dependency # Optional alias

  - name: rabbitmq
    version: "12.0.5" # Check for latest stable/compatible Bitnami RabbitMQ chart version
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
    # alias: rabbitmq-dependency

  # Ollama Dependency Note:
  # As of creating this chart, there isn't a single, official, universally adopted Helm chart for Ollama
  # that is as standardized as those for Redis or RabbitMQ (e.g., from Bitnami).
  # Community charts for Ollama exist (e.g., https://github.com/ollama-helm/ollama).
  # This chart currently DOES NOT bundle Ollama as a subchart dependency due to this variability.
  # Instead, you are expected to deploy Ollama separately into your Kubernetes cluster.
  # The `values.yaml` file under the `ollama:` section allows you to specify the
  # Kubernetes service name and port of YOUR Ollama deployment, which the RAG Query Service will use.
  # If you choose to use a community Ollama Helm chart, you would deploy it separately and then
  # configure this chart's `values.yaml` (`ollama.service.name` and `ollama.service.port`) to point to it.
  #
  # Example if a stable subchart were to be integrated in the future:
  # - name: ollama
  #   version: "<chart-version>"
  #   repository: "<ollama-chart-repository-url>"
  #   condition: ollama.subchart.enabled # e.g. values.ollama.subchart.enabled
  #   alias: ollama-dependency

# Optional: Specify maintainers
# maintainers:
#   - name: YourName
#     email: your.email@example.com

# Optional: Specify keywords for your chart
# keywords:
#   - rag
#   - ai
#   - nlp

# Optional: Home page URL
# home: https://example.com/rag-system-docs
