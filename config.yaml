model:
  embedding_model: "Snowflake-Labs/arctic-embed2"
  llm_model: "meta-llama/Llama-2-7b-hf" # Example, can be overridden by ENV_VAR: MODEL_LLM_MODEL
  device: "cuda" # Can be overridden by ENV_VAR: MODEL_DEVICE (e.g., "cpu", "cuda:0")
  batch_size: 32 # Can be overridden by ENV_VAR: MODEL_BATCH_SIZE
  max_length: 512
  versioning:
    enabled: true
    storage_dir: "data/model_versions"
  benchmarking:
    enabled: true
    output_dir: "data/benchmarks"
    default_sample_size: 100

# Vector store configuration with multiple providers
vector_store:
  provider: "qdrant"  # Default provider, ENV_VAR: VECTOR_STORE_PROVIDER
  qdrant:
    host: "localhost" # ENV_VAR: QDRANT_HOST
    port: 6333 # ENV_VAR: QDRANT_PORT
    collection_name: "documents" # ENV_VAR: QDRANT_COLLECTION_NAME
    vector_size: 768 # Usually fixed per model, but can be ENV_VAR: QDRANT_VECTOR_SIZE
  weaviate:
    host: "localhost" # ENV_VAR: WEAVIATE_HOST
    port: 8080 # ENV_VAR: WEAVIATE_PORT
    class_name: "Document" # ENV_VAR: WEAVIATE_CLASS_NAME
    api_key: "" # ENV_VAR: WEAVIATE_API_KEY (SET VIA ENVIRONMENT VARIABLE, DO NOT COMMIT ACTUAL KEY)
  pinecone:
    api_key: "" # ENV_VAR: PINECONE_API_KEY (SET VIA ENVIRONMENT VARIABLE, DO NOT COMMIT ACTUAL KEY)
    environment: "us-west1-gcp" # ENV_VAR: PINECONE_ENVIRONMENT
    index_name: "documents" # ENV_VAR: PINECONE_INDEX_NAME
    dimension: 768 # Usually fixed per model
  milvus:
    host: "localhost" # ENV_VAR: MILVUS_HOST
    port: "19530" # ENV_VAR: MILVUS_PORT (pymilvus client expects string)
    collection_name: "documents" # ENV_VAR: MILVUS_COLLECTION_NAME
    # vector_dim is determined by embedding model; distance_metric by initialize()
    # user: "" # Optional: ENV_VAR: MILVUS_USER
    # password: "" # Optional: ENV_VAR: MILVUS_PASSWORD
  chroma:
    # For HTTP client:
    host: "localhost" # Optional: ENV_VAR: CHROMA_HOST
    port: 8000 # Optional: ENV_VAR: CHROMA_PORT
    # use_ssl: false # Optional: ENV_VAR: CHROMA_USE_SSL
    # headers: {} # Optional: e.g. {"Authorization": "Bearer <token>"}
    # For Persistent client (local disk):
    path: "data/chroma_db" # Optional: ENV_VAR: CHROMA_PATH. If host/port and path are empty, uses EphemeralClient (in-memory)
    collection_name: "documents" # ENV_VAR: CHROMA_COLLECTION_NAME
    # distance_metric: "cosine" # Or "l2", "ip". Passed to initialize()
  faiss:
    index_file_path: "data/faiss_index.bin" # ENV_VAR: FAISS_INDEX_PATH
    metadata_file_path: "data/faiss_metadata.pkl" # ENV_VAR: FAISS_METADATA_PATH
    collection_name: "documents" # Conceptual name, mainly for consistency
    # distance_metric: "L2" # Or "IP". Passed to initialize()
    # faiss_index_type: "IndexFlatL2" # Passed to initialize() e.g. "IndexFlatIP", "IndexHNSWFlat"
  # Common settings (can be overridden per provider if needed, or used as defaults by services)
  default_collection_name: "documents"
  default_distance_metric: "Cosine" # Generic, will be mapped by each provider

# LLM service configuration with multiple providers
llm:
  default_provider: "huggingface"
  providers:
    huggingface:
      models: ["meta-llama/Llama-2-7b-hf", "google/flan-t5-base"] # ENV_VAR: LLM_PROVIDERS_HUGGINGFACE_MODELS (comma separated)
    openai:
      api_key: "" # ENV_VAR: OPENAI_API_KEY (SET VIA ENVIRONMENT VARIABLE, DO NOT COMMIT ACTUAL KEY)
      models: ["gpt-4o", "gpt-3.5-turbo"] # ENV_VAR: LLM_PROVIDERS_OPENAI_MODELS (comma separated)
    anthropic:
      api_key: "" # ENV_VAR: ANTHROPIC_API_KEY (SET VIA ENVIRONMENT VARIABLE, DO NOT COMMIT ACTUAL KEY)
      models: ["claude-3-opus-20240229"] # ENV_VAR: LLM_PROVIDERS_ANTHROPIC_MODELS (comma separated)

# Knowledge graph configuration
knowledge_graph:
  enabled: true
  name: "document_knowledge_graph"
  storage_dir: "data/knowledge_graphs"
  model: "en_core_web_lg"

processing:
  chunk_size: 512
  chunk_overlap: 50
  batch_size: 32
  max_workers: 4

cache_dir: "cache"
enable_active_learning: true
enable_categorization: true
enable_workflows: true

# Logging configuration
logging:
  level: "INFO" # ENV_VAR: LOGGING_LEVEL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s" # ENV_VAR: LOGGING_FORMAT
  file: "logs/rag_pipeline.log" # ENV_VAR: LOGGING_FILE (Note: in containers, prefer stdout/stderr)

# API configuration (relevant if running services standalone, may be overridden by K8s service definitions)
api:
  host: "0.0.0.0" # ENV_VAR: API_HOST
  port: 8000 # ENV_VAR: API_PORT (Specific service ports like API_GATEWAY_PORT will take precedence)
  workers: 4 # ENV_VAR: API_WORKERS
  timeout: 60 # ENV_VAR: API_TIMEOUT
  cors_origins: ["*"] # ENV_VAR: API_CORS_ORIGINS (comma separated)
