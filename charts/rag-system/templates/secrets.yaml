{{- /*
This template optionally creates a Kubernetes Secret for API keys
if configured in values.yaml (internalApiGateway.apiKeys.createSecret = true
and internalApiGateway.apiKeys.existingSecret.name is not set).

IMPORTANT: For production, it is strongly recommended to manage secrets
outside of the Helm chart (e.g., using Sealed Secrets, Vault, or pre-creating
them in the cluster) and then reference the existing secret name in values.yaml.
Storing plain text secrets directly in values.yaml (even if base64 encoded by Helm later)
is not a secure practice for production environments.
*/ -}}
{{- if and .Values.internalApiGateway.enabled .Values.internalApiGateway.apiKeys.createSecret (not .Values.internalApiGateway.apiKeys.existingSecret.name) .Values.internalApiGateway.apiKeys.directValues }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-system.componentFullname" (dict "component" .Values.internalApiGateway "context" .) }}-apikeys
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.internalApiGateway.name }}
type: Opaque
data:
  {{ .Values.internalApiGateway.apiKeys.existingSecret.keyName | default "api-keys-csv" }}: {{ .Values.internalApiGateway.apiKeys.directValues | b64enc | quote }}
---
{{- /* Example for RabbitMQ password if managed by this chart and not subchart's secret handling */}}
{{- /*
{{- if and .Values.rabbitmq.enabled .Values.rabbitmq.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-rabbitmq-secret" (include "rag-system.fullname" .) }}
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
type: Opaque
data:
  rabbitmq-password: {{ .Values.rabbitmq.auth.password | b64enc | quote }}
  # rabbitmq-username: {{ .Values.rabbitmq.auth.username | b64enc | quote }} # Usually username is not secret but can be
{{- end }}
*/}}
{{- /* Similar stubs can be added for Redis password etc. if needed */}}
{{- end }}
---
{{- if and .Values.notificationService.enabled .Values.notificationService.secrets.create (not .Values.notificationService.secrets.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-system.fullname" . }}-notification-secrets
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.notificationService.name }}
type: Opaque
data:
  SMTP_SERVER: {{ .Values.notificationService.secrets.smtpServer | b64enc | quote }}
  SMTP_PORT: {{ .Values.notificationService.secrets.smtpPort | b64enc | quote }}
  SMTP_USERNAME: {{ .Values.notificationService.secrets.smtpUsername | b64enc | quote }}
  SMTP_PASSWORD: {{ .Values.notificationService.secrets.smtpPassword | b64enc | quote }}
  SENDER_EMAIL: {{ .Values.notificationService.secrets.senderEmail | b64enc | quote }}
{{- end }}
