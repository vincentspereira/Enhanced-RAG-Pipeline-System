{{- if .Values.notificationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-system.componentFullname" (dict "component" .Values.notificationService "context" .) }}
  labels:
    {{- include "rag-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.notificationService.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rag-system.selectorLabelsComponent" (dict "componentName" .Values.notificationService.name "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-system.selectorLabelsComponent" (dict "componentName" .Values.notificationService.name "context" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-system.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.notificationService.name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/entrypoint.sh"]
          args: ["notification_service"] # Assuming entrypoint.sh will support this
          ports:
            - name: http
              containerPort: {{ .Values.notificationService.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rag-system.componentFullname" (dict "component" .Values.notificationService "context" .) }}-config
          env:
            - name: SMTP_SERVER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-system.fullname" . }}-notification-secrets
                  key: SMTP_SERVER
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-system.fullname" . }}-notification-secrets
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-system.fullname" . }}-notification-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-system.fullname" . }}-notification-secrets
                  key: SMTP_PASSWORD
            - name: SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-system.fullname" . }}-notification-secrets
                  key: SENDER_EMAIL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
