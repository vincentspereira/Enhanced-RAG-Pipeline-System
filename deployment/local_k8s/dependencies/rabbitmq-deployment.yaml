apiVersion: apps/v1
kind: Deployment # Using Deployment for simplicity in local setup. StatefulSet for production.
metadata:
  name: rabbitmq
  namespace: default # Or your target namespace
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-management # Using a specific version with management plugin
        ports:
        - containerPort: 5672 # AMQP port
          name: amqp
        - containerPort: 15672 # Management UI port
          name: http-mgmt
        env:
        # Default user/pass is guest/guest. For local testing, this is often fine.
        # For more security, set these via K8s Secrets and reference them.
        # Example (if you were to use secrets):
        # - name: RABBITMQ_DEFAULT_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: rabbitmq-credentials
        #       key: username
        # - name: RABBITMQ_DEFAULT_PASS
        #   valueFrom:
        #     secretKeyRef:
        #       name: rabbitmq-credentials
        #       key: password
          - name: RABBITMQ_DEFAULT_USER
            value: "user" # For local testing, avoid default guest/guest if exposing mgmt UI widely
          - name: RABBITMQ_DEFAULT_PASS
            value: "password" # Change this for any real scenario
        # Volume for data persistence (important for message brokers)
        # Using emptyDir for simplest local setup - data lost if pod restarts.
        # For better local persistence, consider hostPath (Minikube/Kind specific setup)
        # or a proper PersistentVolumeClaim if your local K8s supports dynamic provisioning.
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
      volumes:
      - name: rabbitmq-data
        emptyDir: {} # Data will not persist if the pod is deleted and recreated.
                     # Change to a PersistentVolumeClaim for production or stateful local tests.
        # Example with hostPath (ensure path exists on your K8s node or Minikube VM):
        # hostPath:
        #   path: /mnt/data/rabbitmq # Minikube: /data/rabbitmq or similar
        #   type: DirectoryOrCreate
        readinessProbe:
          tcpSocket: # RabbitMQ ready when AMQP port is open
            port: 5672
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec: # rabbitmq-diagnostics check_port_connectivity ensures node is listening
            command:
            - rabbitmq-diagnostics
            - check_port_connectivity
          initialDelaySeconds: 60 # Give it more time to start fully
          periodSeconds: 30
          timeoutSeconds: 15
