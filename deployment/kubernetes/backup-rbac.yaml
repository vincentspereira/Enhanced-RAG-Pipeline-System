apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-pipeline-backup-sa
  namespace: rag-pipeline # Ensure this matches your application's namespace
  labels:
    app.kubernetes.io/name: rag-pipeline-backup-job

